name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MicSwitcher.sln

      - name: Build
        run: dotnet build MicSwitcher.sln -c Release --no-restore

      - name: Test
        run: dotnet test MicSwitcher.sln -c Release --no-build --verbosity normal
